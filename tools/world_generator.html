<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Game World Generator</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #1e1e1e;
        color: #eeeeee;
        overflow: hidden;
      }

      #app {
        display: flex;
        height: 100vh;
      }

      #sidebar {
        width: 300px;
        min-width: 300px;
        background: #292929;
        padding: 16px;
        overflow-y: auto;
        border-right: 1px solid #444;
      }

      #sidebar h1 {
        margin-top: 0;
        font-size: 20px;
      }

      .section {
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid #444;
      }

      .section:last-child {
        border-bottom: none;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: #cccccc;
      }

      input,
      select,
      button {
        width: 100%;
        padding: 8px;
        margin-bottom: 8px;
        background: #333;
        color: white;
        border: 1px solid #555;
        border-radius: 4px;
      }

      button {
        cursor: pointer;
      }

      button:hover {
        background: #444;
      }

      button.active {
        background: #666;
        border-color: #999;
      }

      .row {
        display: flex;
        gap: 8px;
      }

      .row > * {
        flex: 1;
      }

      #canvas-container {
        flex: 1;
        overflow: auto;
        background: #151515;
        position: relative;
      }

      canvas {
        display: block;
        cursor: crosshair;
        image-rendering: pixelated;
      }

      .layer-button {
        text-align: left;
      }

      .tool-button {
        text-align: left;
      }

      #info {
        font-size: 12px;
        color: #aaa;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div id="sidebar">
        <h1>Game World Generator</h1>

        <div class="section">
          <label>World Width</label>
          <input id="worldWidth" type="number" min="1" value="64" />

          <label>World Height</label>
          <input id="worldHeight" type="number" min="1" value="32" />

          <button id="createWorldButton">Create / Resize World</button>
        </div>

        <div class="section">
          <label>Active Layer</label>

          <button id="tileLayerButton" class="layer-button active">
            Tiles
          </button>

          <button id="entityLayerButton" class="layer-button">Entities</button>
        </div>

        <div class="section">
          <label>Tool</label>

          <button id="brushToolButton" class="tool-button active">Brush</button>

          <button id="fillToolButton" class="tool-button">Fill</button>

          <button id="eraserToolButton" class="tool-button">Eraser</button>
        </div>

        <div class="section">
          <label>Brush Size</label>

          <input id="brushSize" type="number" min="1" max="64" value="1" />
        </div>

        <div class="section">
          <label>Zoom / Tile Size</label>

          <input id="tileSize" type="number" min="2" max="100" value="20" />
        </div>

        <div class="section">
          <label>Tile Type</label>

          <select id="tileType">
            <option value="0">Floor (0)</option>
            <option value="1">Wall (1)</option>
          </select>
        </div>

        <div class="section">
          <label>Entity Type</label>

          <select id="entityType">
            <option value="0">Empty (0)</option>
          </select>

          <div id="info">
            More NPC/interactable types can be added later once you have your
            generated tile map type lookup.
          </div>
        </div>

        <div class="section">
          <button id="exportButton">Export world.json</button>

          <button id="importButton">Import world.json</button>

          <input
            id="fileInput"
            type="file"
            accept=".json"
            style="display: none"
          />
        </div>

        <div class="section">
          <div id="info">
            <strong>Current format:</strong>

            <br /><br />

            Tiles layer:
            <br />
            0 = Floor
            <br />
            1 = Wall
            <br />
            2 = Spawn
            <br />

            Entity layer:
            <br />
            0 = Empty
          </div>
        </div>
      </div>

      <div id="canvas-container">
        <canvas id="worldCanvas"></canvas>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("worldCanvas");
      const ctx = canvas.getContext("2d");

      const canvasContainer = document.getElementById("canvas-container");

      const worldWidthInput = document.getElementById("worldWidth");

      const worldHeightInput = document.getElementById("worldHeight");

      const brushSizeInput = document.getElementById("brushSize");

      const tileSizeInput = document.getElementById("tileSize");

      const tileTypeSelect = document.getElementById("tileType");

      const entityTypeSelect = document.getElementById("entityType");

      const tileLayerButton = document.getElementById("tileLayerButton");

      const entityLayerButton = document.getElementById("entityLayerButton");

      const brushToolButton = document.getElementById("brushToolButton");

      const fillToolButton = document.getElementById("fillToolButton");

      const eraserToolButton = document.getElementById("eraserToolButton");

      const createWorldButton = document.getElementById("createWorldButton");

      const exportButton = document.getElementById("exportButton");

      const importButton = document.getElementById("importButton");

      const fileInput = document.getElementById("fileInput");

      let world = {
        tiles: [],
        entities: [],
      };

      let activeLayer = "tiles";

      let activeTool = "brush";

      let mouseDown = false;

      function create2DArray(width, height, defaultValue) {
        const array = [];

        for (let y = 0; y < height; y++) {
          const row = [];

          for (let x = 0; x < width; x++) {
            row.push(defaultValue);
          }

          array.push(row);
        }

        return array;
      }

      function createWorld() {
        const width = Math.max(1, parseInt(worldWidthInput.value));

        const height = Math.max(1, parseInt(worldHeightInput.value));

        world = {
          tiles: create2DArray(width, height, 0),

          entities: create2DArray(width, height, 0),
        };

        render();
      }

      function getWorldWidth() {
        if (world.tiles.length === 0) {
          return 0;
        }

        return world.tiles[0].length;
      }

      function getWorldHeight() {
        return world.tiles.length;
      }

      function getTileSize() {
        return Math.max(2, parseInt(tileSizeInput.value));
      }

      function resizeCanvas() {
        const tileSize = getTileSize();

        canvas.width = getWorldWidth() * tileSize;

        canvas.height = getWorldHeight() * tileSize;
      }

      function getActiveLayerData() {
        return world[activeLayer];
      }

      function render() {
        resizeCanvas();

        const tileSize = getTileSize();

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < getWorldHeight(); y++) {
          for (let x = 0; x < getWorldWidth(); x++) {
            const tile = world.tiles[y][x];

            /*
                TILE LAYER

                0 = Floor
                1 = Wall
            */

            if (tile === 0) {
              ctx.fillStyle = "#555";
            } else if (tile === 1) {
              ctx.fillStyle = "#222";
            } else {
              ctx.fillStyle = "#ff00ff";
            }

            ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);

            /*
                ENTITY LAYER

                Currently:

                0 = Empty

                Later you can add:

                3 = Goblin
                4 = Rat
                5 = Chest
                etc.
            */

            const entity = world.entities[y][x];

            if (entity !== 0) {
              ctx.fillStyle = "#ffcc00";

              const padding = Math.max(2, tileSize * 0.2);

              ctx.fillRect(
                x * tileSize + padding,
                y * tileSize + padding,
                tileSize - padding * 2,
                tileSize - padding * 2,
              );

              ctx.fillStyle = "black";

              ctx.font = `${Math.max(8, tileSize * 0.4)}px Arial`;

              ctx.textAlign = "center";
              ctx.textBaseline = "middle";

              ctx.fillText(
                entity,
                x * tileSize + tileSize / 2,
                y * tileSize + tileSize / 2,
              );
            }

            /*
                GRID
            */

            ctx.strokeStyle = "#777";
            ctx.lineWidth = 1;

            ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
          }
        }

        /*
        Highlight active layer slightly.
    */

        if (activeLayer === "entities") {
          ctx.fillStyle = "rgba(255, 255, 0, 0.04)";

          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      function getCanvasTile(event) {
        const rect = canvas.getBoundingClientRect();

        const tileSize = getTileSize();

        const mouseX = event.clientX - rect.left;

        const mouseY = event.clientY - rect.top;

        const x = Math.floor(mouseX / tileSize);

        const y = Math.floor(mouseY / tileSize);

        return {
          x,
          y,
        };
      }

      function isValidPosition(x, y) {
        return x >= 0 && y >= 0 && x < getWorldWidth() && y < getWorldHeight();
      }

      function getBrushValue() {
        if (activeTool === "eraser") {
          return 0;
        }

        if (activeLayer === "tiles") {
          return parseInt(tileTypeSelect.value);
        }

        return parseInt(entityTypeSelect.value);
      }

      function paintBrush(centerX, centerY) {
        const brushSize = Math.max(1, parseInt(brushSizeInput.value));

        const layer = getActiveLayerData();

        const value = getBrushValue();

        const startOffset = Math.floor(brushSize / 2);

        for (let y = 0; y < brushSize; y++) {
          for (let x = 0; x < brushSize; x++) {
            const worldX = centerX + x - startOffset;

            const worldY = centerY + y - startOffset;

            if (!isValidPosition(worldX, worldY)) {
              continue;
            }

            layer[worldY][worldX] = value;
          }
        }

        render();
      }

      function floodFill(startX, startY, replacementValue) {
        if (!isValidPosition(startX, startY)) {
          return;
        }

        const layer = getActiveLayerData();

        const targetValue = layer[startY][startX];

        if (targetValue === replacementValue) {
          return;
        }

        const stack = [[startX, startY]];

        while (stack.length > 0) {
          const [x, y] = stack.pop();

          if (!isValidPosition(x, y)) {
            continue;
          }

          if (layer[y][x] !== targetValue) {
            continue;
          }

          layer[y][x] = replacementValue;

          stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }

        render();
      }

      function applyTool(event) {
        const { x, y } = getCanvasTile(event);

        if (!isValidPosition(x, y)) {
          return;
        }

        if (activeTool === "fill") {
          floodFill(x, y, getBrushValue());

          return;
        }

        paintBrush(x, y);
      }

      /*
    MOUSE EVENTS
*/

      canvas.addEventListener("mousedown", (event) => {
        mouseDown = true;

        applyTool(event);
      });

      canvas.addEventListener("mousemove", (event) => {
        if (!mouseDown) {
          return;
        }

        if (activeTool === "fill") {
          return;
        }

        applyTool(event);
      });

      window.addEventListener("mouseup", () => {
        mouseDown = false;
      });

      /*
    LAYER SELECTION
*/

      tileLayerButton.addEventListener("click", () => {
        activeLayer = "tiles";

        tileLayerButton.classList.add("active");

        entityLayerButton.classList.remove("active");

        render();
      });

      entityLayerButton.addEventListener("click", () => {
        activeLayer = "entities";

        entityLayerButton.classList.add("active");

        tileLayerButton.classList.remove("active");

        render();
      });

      /*
    TOOL SELECTION
*/

      function setActiveTool(tool) {
        activeTool = tool;

        brushToolButton.classList.remove("active");

        fillToolButton.classList.remove("active");

        eraserToolButton.classList.remove("active");

        if (tool === "brush") {
          brushToolButton.classList.add("active");
        }

        if (tool === "fill") {
          fillToolButton.classList.add("active");
        }

        if (tool === "eraser") {
          eraserToolButton.classList.add("active");
        }
      }

      brushToolButton.addEventListener("click", () => {
        setActiveTool("brush");
      });

      fillToolButton.addEventListener("click", () => {
        setActiveTool("fill");
      });

      eraserToolButton.addEventListener("click", () => {
        setActiveTool("eraser");
      });

      /*
    WORLD CREATION
*/

      createWorldButton.addEventListener("click", createWorld);

      /*
    ZOOM
*/

      tileSizeInput.addEventListener("input", render);

      /*
    EXPORT
*/

      exportButton.addEventListener("click", () => {
        const json = JSON.stringify(world, null, 2);

        const blob = new Blob([json], {
          type: "application/json",
        });

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;

        link.download = "world.json";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);
      });

      /*
    IMPORT
*/

      importButton.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", (event) => {
        const file = event.target.files[0];

        if (!file) {
          return;
        }

        const reader = new FileReader();

        reader.onload = (loadEvent) => {
          try {
            const parsed = JSON.parse(loadEvent.target.result);

            if (!parsed.tiles || !parsed.entities) {
              throw new Error("Invalid world file");
            }

            if (
              !Array.isArray(parsed.tiles) ||
              !Array.isArray(parsed.entities)
            ) {
              throw new Error("World layers must be arrays");
            }

            if (parsed.tiles.length !== parsed.entities.length) {
              throw new Error("Tiles and entities have different heights");
            }

            for (let y = 0; y < parsed.tiles.length; y++) {
              if (!Array.isArray(parsed.tiles[y])) {
                throw new Error("Invalid tiles row");
              }

              if (!Array.isArray(parsed.entities[y])) {
                throw new Error("Invalid entities row");
              }

              if (parsed.tiles[y].length !== parsed.entities[y].length) {
                throw new Error("Tiles and entities have different widths");
              }
            }

            world = {
              tiles: parsed.tiles,

              entities: parsed.entities,
            };

            worldWidthInput.value = getWorldWidth();

            worldHeightInput.value = getWorldHeight();

            render();
          } catch (error) {
            alert("Failed to import world:\n\n" + error.message);
          }
        };

        reader.readAsText(file);
      });

      /*
    INITIAL WORLD
*/

      createWorld();
    </script>
  </body>
</html>
