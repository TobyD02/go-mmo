<!doctype html>
<html>
  <head>
    <title>WebSocket Test</title>
  </head>
  <body>
    <button id="connect">Connect</button>
    <button id="send">Send</button>

    <pre id="output"></pre>
    <canvas id="myCanvas"></canvas>

    <script>
      let uuid = Math.random().toString(16).slice(2);
      let socket;

      let playerColors = {};

      let canvas = document.getElementById("myCanvas");

      let ctx = canvas.getContext("2d");

      const GRID_SIZE = 20;
      canvas.width = GRID_SIZE * 50;
      canvas.height = GRID_SIZE * 30;

      <!-- const output = document.getElementById("output"); -->

      function log(message) {
        console.log(message);
      }

      document.getElementById("connect").onclick = () => {
        socket = new WebSocket("ws://localhost:8080/ws");

        socket.onopen = () => {
          socket.send(
            JSON.stringify({
              type: "connect",
              id: uuid,
            }),
          );
          log("Connected");
        };

        socket.onmessage = (event) => {
          log("Server: " + event.data);
          onMessage(event.data);
        };

        socket.onclose = () => {
          log("Disconnected");
        };

        socket.onerror = (error) => {
          log("Error");
          console.error(error);
        };
      };

      function onMessage(data) {
        let worldState = JSON.parse(data);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (const [id, pos] of Object.entries(worldState)) {
          if (playerColors[id] == undefined) {
            playerColors[id] =
              `rgba(${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 255})`;
          }

          ctx.fillStyle = playerColors[id];
          ctx.fillText(id, pos.x * GRID_SIZE, pos.y * GRID_SIZE + 20);
          ctx.fillRect(
            pos.x * GRID_SIZE,
            pos.y * GRID_SIZE,
            GRID_SIZE,
            GRID_SIZE,
          );
        }

        let payload = JSON.stringify({
          dx: Math.round(Math.random() * 2 - 1),
          dy: Math.round(Math.random() * 2 - 1),
        });

        console.log("sending payload: " + payload);
        socket.send(payload);
      }

      document.getElementById("send").onclick = () => {
        socket.send(
          JSON.stringify({
            dx: 1,
            dy: 1,
          }),
        );
        log("Client: hello server");
      };
    </script>
  </body>
</html>
