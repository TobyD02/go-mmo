x-headless-client: &headless-client
  depends_on:
    server:
      condition: "service_started"
  image: mmo:latest
  entrypoint: ["headless_client"]
  environment:
    G_SERVER: "ws://server:8080"

services:
  server:
    build: .
    image: mmo:latest
    entrypoint: ["server"]
    ports:
      - "8080:8080"

  client1:
    <<: *headless-client
